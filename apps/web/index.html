<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDFBF7" />

    <!--
      NOTE: <title>, meta description and canonical are managed client-side by
      TanStack Router (see src/lib/seo.ts and each route's `head` option).
      Do NOT add them here: React 19 does not dedupe router-injected tags
      against static ones, which would produce duplicates.
      The tags below are static-only (social scrapers don't execute JS).
    -->

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

    <!-- Open Graph (site-wide defaults, served to all routes) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier Créart-Thérapie" />
    <meta property="og:locale" content="fr_CH" />
    <meta property="og:title" content="Atelier Créart-Thérapie | Art-thérapie à Fribourg" />
    <meta property="og:description" content="Séances individuelles et ateliers de groupe d'art-thérapie avec Monique Roon à Fribourg. Art-thérapeute agréée ASCA. Séance d'essai 90 CHF." />
    <meta property="og:url" content="https://creart-therapie.ch/" />
    <meta property="og:image" content="https://creart-therapie.ch/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Atelier Créart-Thérapie — Cultive ta créativité et transforme ton quotidien" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atelier Créart-Thérapie | Art-thérapie à Fribourg" />
    <meta name="twitter:description" content="Séances individuelles et ateliers de groupe d'art-thérapie avec Monique Roon à Fribourg. Art-thérapeute agréée ASCA." />
    <meta name="twitter:image" content="https://creart-therapie.ch/assets/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HealthAndBeautyBusiness",
      "name": "Atelier Créart-Thérapie",
      "description": "Atelier d'art-thérapie à Fribourg : séances individuelles et ateliers de groupe pour adultes et enfants. Art-thérapeute agréée ASCA, remboursée par les assurances complémentaires.",
      "url": "https://creart-therapie.ch/",
      "logo": "https://creart-therapie.ch/assets/Logo_VF2.jpeg",
      "image": "https://creart-therapie.ch/assets/og-image.jpg",
      "telephone": "+41788421492",
      "email": "info@creart-therapie.ch",
      "priceRange": "50 CHF – 120 CHF",
      "currenciesAccepted": "CHF",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Fribourg",
        "addressCountry": "CH"
      },
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Région de Fribourg"
      },
      "founder": {
        "@type": "Person",
        "name": "Monique Roon",
        "jobTitle": "Art-thérapeute"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Kalam:wght@300;400;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
